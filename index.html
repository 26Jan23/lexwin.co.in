<style>
:root {

  --white:       #ffffff;

  --text-dark:   #0c1a35;

  --transition:  0.3s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'Source Sans 3', sans-serif;
  color: var(--text-dark);
  background: var(--white);
  line-height: 1.7;

}

h1, h2, h3, h4 {

}

.label {

  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;

}
.label-light { color: var(--gold-light); }

/* ── ORNAMENT ── */
.ornament {
  display: inline-block; width: 40px; height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  margin: 0.6rem 0 0.4rem; vertical-align: middle;
}

/* ── NAVIGATION ── */
nav {

  background: rgba(12,26,53,0.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(184,146,42,0.2);
  transition: var(--transition);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;

}
.nav-logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
.nav-logo-main {

}
.nav-logo-divider { width: 1px; height: 20px; background: rgba(184,146,42,0.4); }

}
.nav-links { display: flex; align-items: center; gap: 0.15rem; list-style: none; }

  letter-spacing: 0.1em; text-transform: uppercase;

}
.nav-links a:hover { color: var(--gold-light); }
.nav-cta {

  color: var(--navy-deep) !important;
  font-weight: 600 !important;
  padding: 0.5rem 1.2rem !important;
}
.nav-cta:hover { background: var(--gold-bright) !important; color: var(--navy-deep) !important; }
.nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
.nav-toggle span { display: block; width: 22px; height: 2px; background: var(--white); margin: 4px 0; transition: var(--transition); }
.nav-open .nav-links {
  display: flex !important; flex-direction: column; align-items: flex-start;
  position: absolute; top: 68px; left: 0; right: 0;
  background: rgba(12,26,53,0.98); backdrop-filter: blur(16px);
  padding: 1rem 1.5rem 1.5rem; gap: 0.2rem;
  border-bottom: 1px solid rgba(184,146,42,0.2);

}
.nav-open .nav-links a { padding: 0.65rem 0.5rem; font-size: 0.85rem; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.06); }
.nav-open .nav-links a:last-child { border-bottom: none; margin-top: 0.5rem; }
.nav-open .nav-toggle span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* ── HERO ── */

}
.hero-texture {
  position: absolute; inset: 0; opacity: 0.04;

    rgba(184,146,42,1) 0, rgba(184,146,42,1) 1px,
    transparent 0, transparent 50%
  );
  background-size: 28px 28px;
}
.hero-glow {
  position: absolute; top: -15%; right: -8%;

  pointer-events: none;
}

}

.hero-eyebrow-line { width: 32px; height: 1px; background: var(--gold); }

.hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }

}

/* Hero right — service cards */
.hero-visual { display: flex; flex-direction: column; gap: 0.8rem; }

}

/* ── TRUST BAR ── */

/* ── SECTIONS ── */
.section { padding: 6rem 2rem; }
.section-alt { background: var(--section-alt); }

.section-inner { max-width: 1200px; margin: 0 auto; }

/* ── WHO WE HELP ── */
.who-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.who-card {

}
.who-card::after {

}

.who-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }

}
.who-card h3 { font-size: 1.12rem; font-weight: 600; color: var(--navy-deep); margin-bottom: 0.5rem; }
.who-card p { font-size: 0.88rem; color: var(--text-mid); line-height: 1.7; font-weight: 300; }

/* ── SERVICES ── */
.services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.service-card {

}
.service-card:hover { box-shadow: var(--shadow-md); border-top-color: var(--gold-bright); }

.service-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.2rem; }

/* ── DOMAINS ── */
.domains-strip { background: var(--navy-deep); padding: 3.5rem 2rem; }
.domains-inner { max-width: 1200px; margin: 0 auto; }

}
.domain-pill:hover { background: rgba(184,146,42,0.2); border-color: rgba(184,146,42,0.5); color: var(--gold-light); }

/* ── WHY LEXWIN ── */
.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4.5rem; align-items: start; }
.why-left .label { margin-bottom: 0.3rem; }
.why-left h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 700; margin-bottom: 1rem; }

.why-points { display: flex; flex-direction: column; gap: 1.5rem; }

.why-point:last-child { border-bottom: none; padding-bottom: 0; }
.why-num {

/* ── CTA BAND ── */

  background: var(--navy-deep);
  border-top: 1px solid rgba(184,146,42,0.2);
  border-bottom: 1px solid rgba(184,146,42,0.2);
  padding: 5.5rem 2rem; text-align: center; position: relative; overflow: hidden;
}
.cta-band::before {
  content: 'LW'; font-family: 'Playfair Display', serif;

<script>
(function () {
  var STAY_MS  = 3200;
  var SLIDE_MS = 350;
  var GAP      = 16;
  var PEEK     = 44;

  var wrap   = document.querySelector('.slideshow-wrap');
  var track  = document.getElementById('slideshowTrack');
  var dotsEl = document.getElementById('slideshowDots');
  if (!track) return;

  var cards  = Array.from(track.querySelectorAll('.blog-card'));
  var total  = cards.length;
  var cur    = 0;
  var timer  = null;

  function vis()  { return window.innerWidth >= 769 ? 3 : 1; }
  function cw()   { return Math.floor((wrap.offsetWidth - GAP * (vis() - 1) - PEEK) / vis()); }

  function setHeight() {
    var w = cw();
    cards.forEach(function (c) {
      c.style.position   = 'relative';
      c.style.transform  = 'none';
      c.style.width      = w + 'px';
      c.style.visibility = 'hidden';
    });
    var maxH = 0;
    cards.forEach(function (c) { maxH = Math.max(maxH, c.offsetHeight); });
    track.style.height = maxH + 'px';
    cards.forEach(function (c) {
      c.style.position   = 'absolute';
      c.style.visibility = 'visible';
    });
  }

  function place(anim) {
    var w  = cw();
    var ww = wrap.offsetWidth;
    var ease = 'cubic-bezier(0.22,1,0.36,1)';
    cards.forEach(function (card, i) {
      card.style.width      = w + 'px';
      card.style.transition = anim ? 'transform ' + SLIDE_MS + 'ms ' + ease : 'none';
      var slot = i - cur;
      if (slot >= 0 && slot < vis()) {
        card.style.transform = 'translateX(' + (slot * (w + GAP)) + 'px)';
      } else if (slot === vis()) {
        /* peek card — partially visible */
        card.style.transform = 'translateX(' + (vis() * (w + GAP) - GAP + 8) + 'px)';
      } else {
        card.style.transform = 'translateX(' + (ww + w + 40) + 'px)';
      }
    });
    updateDots();
  }

  function goNext() {
    var w  = cw();
    var ww = wrap.offsetWidth;
    var ease = 'cubic-bezier(0.22,1,0.36,1)';
    /* slide visible + peek cards out to the left */
    cards.forEach(function (card, i) {
      var slot = i - cur;
      if (slot >= 0 && slot <= vis()) {
        card.style.transition = 'transform ' + SLIDE_MS + 'ms ' + ease;
        card.style.transform  = 'translateX(-' + (ww + w + 40) + 'px)';
      }
    });
    setTimeout(function () {
      cur = (cur + vis()) >= total ? 0 : cur + vis();
      /* snap incoming cards off-right instantly */
      cards.forEach(function (card, i) {
        var slot = i - cur;
        if (slot >= 0 && slot <= vis()) {
          card.style.transition = 'none';
          card.style.transform  = 'translateX(' + (ww + w + 40) + 'px)';
        }
      });
      setHeight();
      track.offsetHeight;
      place(true);
    }, SLIDE_MS + 20);
  }

  function buildDots() {
    dotsEl.innerHTML = '';
    var groups = Math.ceil(total / vis());
    for (var i = 0; i < groups; i++) {
      var dot = document.createElement('button');
      dot.className = 'slideshow-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Slide ' + (i + 1));
      dot.dataset.idx = String(i * vis());
      dot.addEventListener('click', function () {
        clearInterval(timer);
        cur = parseInt(this.dataset.idx);
        setHeight(); place(true);
        timer = setInterval(goNext, STAY_MS + SLIDE_MS * 2);
      });
      dotsEl.appendChild(dot);
    }
  }

  function updateDots() {
    var dots = dotsEl.querySelectorAll('.slideshow-dot');
    var grp  = Math.floor(cur / vis());
    dots.forEach(function (d, i) { d.classList.toggle('active', i === grp); });
  }

  wrap.addEventListener('mouseenter', function () { clearInterval(timer); });
  wrap.addEventListener('mouseleave', function () { timer = setInterval(goNext, STAY_MS + SLIDE_MS * 2); });
  wrap.addEventListener('touchstart',  function () { clearInterval(timer); }, { passive: true });
  wrap.addEventListener('touchend',    function () { timer = setInterval(goNext, STAY_MS + SLIDE_MS * 2); }, { passive: true });

  var resizeT;
  window.addEventListener('resize', function () {
    clearInterval(timer); clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      cur = 0; buildDots(); setHeight(); place(false);
      timer = setInterval(goNext, STAY_MS + SLIDE_MS * 2);
    }, 200);
  });

  setHeight(); buildDots(); place(false);
  timer = setInterval(goNext, STAY_MS + SLIDE_MS * 2);
})();
</script>

  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
}
.label-light { color: var(--gold-light); }

/* ── ORNAMENT ── */
.ornament {
  display: inline-block; width: 40px; height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  margin: 0.6rem 0 0.4rem; vertical-align: middle;
}

/* ── NAVIGATION ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(12,26,53,0.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(184,146,42,0.2);
  transition: var(--transition);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 70px;
}
.nav-logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
.nav-logo-main {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem; font-weight: 700;
  color: var(--white); letter-spacing: 0.02em;
}
.nav-logo-divider { width: 1px; height: 20px; background: rgba(184,146,42,0.4); }
.nav-logo-sub {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.7rem; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(232,201,106,0.7);
}
.nav-links { display: flex; align-items: center; gap: 0.15rem; list-style: none; }
.nav-links a {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.78rem; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  text-decoration: none; padding: 0.5rem 0.9rem;
  border-radius: var(--radius); transition: var(--transition);
}
.nav-links a:hover { color: var(--gold-light); }
.nav-cta {
  background: var(--gold) !important;
  color: var(--navy-deep) !important;
  font-weight: 600 !important;
  padding: 0.5rem 1.2rem !important;
}
.nav-cta:hover { background: var(--gold-bright) !important; color: var(--navy-deep) !important; }
.nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
.nav-toggle span { display: block; width: 22px; height: 2px; background: var(--white); margin: 4px 0; transition: var(--transition); }
.nav-open .nav-links {
  display: flex !important; flex-direction: column; align-items: flex-start;
  position: absolute; top: 68px; left: 0; right: 0;
  background: rgba(12,26,53,0.98); backdrop-filter: blur(16px);
  padding: 1rem 1.5rem 1.5rem; gap: 0.2rem;
  border-bottom: 1px solid rgba(184,146,42,0.2);
  z-index: 99;
}
.nav-open .nav-links a { padding: 0.65rem 0.5rem; font-size: 0.85rem; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.06); }
.nav-open .nav-links a:last-child { border-bottom: none; margin-top: 0.5rem; }
.nav-open .nav-toggle span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 80% 60% at 70% 40%, rgba(26,58,110,0.35) 0%, transparent 60%),
    linear-gradient(160deg, #060e1e 0%, #0c1a35 50%, #112349 100%);
  display: flex; align-items: center;
  position: relative; overflow: hidden;
  padding-top: 70px;
}
.hero-texture {
  position: absolute; inset: 0; opacity: 0.04;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(184,146,42,1) 0, rgba(184,146,42,1) 1px,
    transparent 0, transparent 50%
  );
  background-size: 28px 28px;
}
.hero-glow {
  position: absolute; top: -15%; right: -8%;
  width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(184,146,42,0.12) 0%, transparent 65%);
  pointer-events: none;
}
.hero-line-left {
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, transparent, var(--gold), transparent);
  opacity: 0.4;
}
.hero-inner {
  max-width: 1200px; margin: 0 auto; padding: 5rem 2rem 4rem;
  display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 5rem; align-items: center;
  position: relative; z-index: 2;
}
.hero-eyebrow {
  display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.6rem;
}
.hero-eyebrow-line { width: 32px; height: 1px; background: var(--gold); }
.hero-eyebrow span { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-light); }
.hero h1 {
  font-size: clamp(2.8rem, 4.5vw, 4.2rem);
  color: var(--white); font-weight: 700; margin-bottom: 1.4rem;
  line-height: 1.1;
}
.hero h1 em { font-style: italic; color: var(--gold-light); }
.hero-sub {
  font-size: 1.08rem; color: rgba(255,255,255,0.6);
  margin-bottom: 2.4rem; max-width: 500px; line-height: 1.8;
  font-weight: 300;
}
.hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }

.btn-gold {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--gold); color: var(--navy-deep);
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.82rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.9rem 1.9rem; border-radius: var(--radius);
  text-decoration: none; border: none; cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 20px rgba(184,146,42,0.35);
}
.btn-gold:hover { background: var(--gold-bright); transform: translateY(-1px); box-shadow: 0 6px 28px rgba(184,146,42,0.45); }
.btn-outline {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: transparent; color: rgba(255,255,255,0.8);
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.82rem; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.9rem 1.9rem; border-radius: var(--radius);
  text-decoration: none;
  border: 1px solid rgba(184,146,42,0.35);
  transition: var(--transition);
}
.btn-outline:hover { border-color: rgba(232,201,106,0.7); color: var(--gold-light); }
.btn-navy {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--navy-deep); color: var(--gold-light);
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.82rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.9rem 1.9rem; border-radius: var(--radius);
  text-decoration: none; border: 1px solid var(--gold);
  transition: var(--transition);
}
.btn-navy:hover { background: var(--navy-mid); }

.hero-stats {
  display: flex; gap: 2.5rem; margin-top: 3rem;
  padding-top: 2.4rem;
  border-top: 1px solid rgba(184,146,42,0.2);
  justify-content: center;
  align-items: flex-start;
}
.hero-stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 2.4rem; font-weight: 700; color: var(--gold-light); line-height: 1;
  text-align: center;
}
.hero-stat-label { font-size: 0.72rem; color: rgba(255,255,255,0.45); letter-spacing: 0.06em; margin-top: 0.25rem; text-align: center; }

/* Hero right — service cards */
.hero-visual { display: flex; flex-direction: column; gap: 0.8rem; }
.hero-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(184,146,42,0.18);
  border-left: 3px solid var(--gold);
  border-radius: 4px; padding: 1.2rem 1.4rem;
  transition: var(--transition);
}
.hero-card:hover { background: rgba(255,255,255,0.07); transform: translateX(5px); }
.hero-card:nth-child(2) { border-left-color: var(--gold-light); margin-left: 1rem; }
.hero-card:nth-child(3) { border-left-color: rgba(184,146,42,0.6); margin-left: 2rem; }
.hero-card:nth-child(4) { border-left-color: rgba(184,146,42,0.4); margin-left: 3rem; }
.hero-card-title { font-family: 'Playfair Display', serif; font-size: 1rem; color: rgba(255,255,255,0.9); font-weight: 600; }
.hero-card-text { font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-top: 0.2rem; }

/* ── TRUST BAR ── */
.trust-bar {
  background: var(--navy-mid);
  border-top: 1px solid rgba(184,146,42,0.25);
  border-bottom: 1px solid rgba(184,146,42,0.15);
  padding: 1.5rem 2rem;
}
.trust-bar-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: center;
  gap: 2.5rem; flex-wrap: wrap;
}
.trust-item {
  display: flex; align-items: center; gap: 0.55rem;
  font-size: 0.78rem; color: rgba(255,255,255,0.5);
  font-weight: 400; letter-spacing: 0.05em;
}
.trust-item-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.trust-divider { width: 1px; height: 18px; background: rgba(184,146,42,0.2); }

/* ── SECTIONS ── */
.section { padding: 6rem 2rem; }
.section-alt { background: var(--section-alt); }
.section-dark { background: var(--navy-deep); }
.section-inner { max-width: 1200px; margin: 0 auto; }
.section-header { text-align: center; margin-bottom: 4rem; }
.section-header h2 { font-size: clamp(2rem, 3.5vw, 2.8rem); font-weight: 700; margin-top: 0.5rem; }
.section-header p { font-size: 1rem; color: var(--text-mid); max-width: 560px; margin: 0.9rem auto 0; font-weight: 300; }

/* ── WHO WE HELP ── */
.who-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.who-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 4px; padding: 2rem 1.8rem;
  transition: var(--transition); position: relative; overflow: hidden;
}
.who-card::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
  transform: scaleX(0); transform-origin: left; transition: var(--transition);
}
.who-card:hover::after { transform: scaleX(1); }
.who-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
.who-icon {
  width: 44px; height: 44px; border-radius: 3px;
  background: var(--gold-pale); display: flex; align-items: center;
  justify-content: center; font-size: 1.3rem; margin-bottom: 1.1rem;
}
.who-card h3 { font-size: 1.12rem; font-weight: 600; color: var(--navy-deep); margin-bottom: 0.5rem; }
.who-card p { font-size: 0.88rem; color: var(--text-mid); line-height: 1.7; font-weight: 300; }

/* ── SERVICES ── */
.services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.service-card {
  background: var(--white); border: 1px solid var(--border);
  border-top: 3px solid var(--gold);
  border-radius: 4px; padding: 2.2rem 2rem;
  transition: var(--transition);
}
.service-card:hover { box-shadow: var(--shadow-md); border-top-color: var(--gold-bright); }
.service-num {
  font-family: 'Playfair Display', serif;
  font-size: 3rem; font-weight: 700; color: var(--gold-pale);
  line-height: 1; margin-bottom: 0.8rem; display: block;
}
.service-card h3 { font-size: 1.15rem; font-weight: 700; color: var(--navy-deep); margin-bottom: 0.8rem; }
.service-card p { font-size: 0.87rem; color: var(--text-mid); line-height: 1.75; font-weight: 300; }
.service-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.2rem; }
.service-tag {
  background: var(--gold-pale); color: var(--gold-dark);
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
  padding: 0.25rem 0.65rem; border-radius: 2rem;
  border: 1px solid rgba(184,146,42,0.2);
}

/* ── DOMAINS ── */
.domains-strip { background: var(--navy-deep); padding: 3.5rem 2rem; }
.domains-inner { max-width: 1200px; margin: 0 auto; }
.domains-label { text-align: center; margin-bottom: 2rem; }
.domains-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
.domain-pill {
  background: rgba(184,146,42,0.08);
  border: 1px solid rgba(184,146,42,0.25);
  color: rgba(255,255,255,0.7); font-size: 0.82rem; font-weight: 400;
  padding: 0.55rem 1.3rem; border-radius: 2rem; letter-spacing: 0.04em;
  transition: var(--transition);
}
.domain-pill:hover { background: rgba(184,146,42,0.2); border-color: rgba(184,146,42,0.5); color: var(--gold-light); }

/* ── WHY LEXWIN ── */
.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4.5rem; align-items: start; }
.why-left .label { margin-bottom: 0.3rem; }
.why-left h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 700; margin-bottom: 1rem; }
.why-left > p { font-size: 0.95rem; color: var(--text-mid); margin-bottom: 2rem; line-height: 1.8; font-weight: 300; }
.why-points { display: flex; flex-direction: column; gap: 1.5rem; }
.why-point { display: flex; align-items: flex-start; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.why-point:last-child { border-bottom: none; padding-bottom: 0; }
.why-num {
  flex-shrink: 0; width: 28px; height: 28px;
  border: 1px solid var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif; font-size: 0.8rem; font-weight: 700;
  color: var(--gold); margin-top: 0.1rem;
}
.why-point-text h4 { font-family: 'Source Sans 3', sans-serif; font-size: 0.92rem; font-weight: 600; color: var(--navy-deep); }
.why-point-text p { font-size: 0.85rem; color: var(--text-mid); margin-top: 0.2rem; font-weight: 300; }
.why-right { display: flex; flex-direction: column; gap: 1.2rem; }
.why-quote {
  background: var(--navy-deep); border-radius: 4px; padding: 2.5rem;
  position: relative;
}
.why-quote::before {
  content: '\201C';
  font-family: 'Playfair Display', serif; font-size: 6rem; line-height: 1;
  color: var(--gold); opacity: 0.2;
  position: absolute; top: -0.5rem; left: 1.5rem;
}
.why-quote p { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-style: italic; color: rgba(255,255,255,0.85); line-height: 1.6; position: relative; z-index: 1; }
.why-quote cite { display: block; font-size: 0.78rem; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1rem; font-style: normal; }
.why-stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.why-stat-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 4px; padding: 1.6rem; text-align: center;
  box-shadow: var(--shadow-sm);
}
.why-stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem; font-weight: 700; color: var(--gold-dark); line-height: 1;
}
.why-stat-label { font-size: 0.76rem; color: var(--text-light); margin-top: 0.4rem; font-weight: 400; }
.why-diff-stack { display: flex; flex-direction: column; gap: 1rem; }
.why-diff-card {
  background: var(--white); border: 1px solid var(--border);
  border-left: 3px solid var(--gold); border-radius: 4px;
  padding: 1.4rem 1.6rem; display: flex; align-items: flex-start; gap: 1rem;
  transition: var(--transition);
}
.why-diff-card:hover { box-shadow: var(--shadow-sm); transform: translateX(3px); }
.why-diff-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 0.1rem; }
.why-diff-title {
  font-family: 'Source Sans 3', sans-serif; font-size: 0.9rem;
  font-weight: 700; color: var(--navy-deep); margin-bottom: 0.3rem;
}
.why-diff-text { font-size: 0.84rem; color: var(--text-mid); line-height: 1.68; font-weight: 300; }

/* ── ENGAGEMENT ── */
.engagement-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
.engagement-card {
  border: 1px solid var(--border); border-radius: 4px; padding: 2.5rem;
  background: var(--white); transition: var(--transition);
}
.engagement-card:hover { box-shadow: var(--shadow-md); }
.engagement-card.featured {
  background: var(--white);
  border-color: var(--border);
  border-width: 1px;
}
.engagement-tag {
  display: inline-block; font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0.25rem 0.8rem; border-radius: 2rem; margin-bottom: 1.2rem;
  background: var(--gold-pale); color: var(--gold-dark);
  border: 1px solid rgba(184,146,42,0.3);
}
.engagement-card.featured .engagement-tag {
  background: var(--gold-pale); color: var(--gold-dark);
  border-color: rgba(184,146,42,0.3);
}
.engagement-card h3 { font-size: 1.55rem; font-weight: 700; color: var(--navy-deep); margin-bottom: 0.8rem; }
.engagement-card.featured h3 { color: var(--navy-deep); }
.engagement-card p { font-size: 0.9rem; color: var(--text-mid); line-height: 1.75; font-weight: 300; }
.engagement-card.featured p { color: var(--text-mid); }
.engagement-divider { width: 40px; height: 1px; background: var(--gold); margin: 1.4rem 0; }
.engagement-features { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
.engagement-features li { display: flex; align-items: center; gap: 0.7rem; font-size: 0.87rem; color: var(--text-mid); }
.engagement-card.featured .engagement-features li { color: var(--text-mid); }
.engagement-features li::before { content: '—'; color: var(--gold); font-weight: 600; flex-shrink: 0; }

/* Desktop: 3.5 cards visible — card width = viewport/3.5 approx */
  width: 320px;
  flex-shrink: 0;
}

}

/* ── CTA BAND ── */
.cta-band {
  background: var(--navy-deep);
  border-top: 1px solid rgba(184,146,42,0.2);
  border-bottom: 1px solid rgba(184,146,42,0.2);
  padding: 5.5rem 2rem; text-align: center; position: relative; overflow: hidden;
}
.cta-band::before {
  content: 'LW'; font-family: 'Playfair Display', serif;
  font-size: 28rem; font-weight: 700; color: rgba(184,146,42,0.03);
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  pointer-events: none; line-height: 1; letter-spacing: -0.05em;
}
.cta-band-inner { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; }
.cta-band h2 { font-size: clamp(1.9rem, 3vw, 2.7rem); color: var(--white); font-weight: 700; margin-bottom: 0.8rem; }
.cta-band p { color: rgba(255,255,255,0.55); font-size: 1rem; margin-bottom: 2.4rem; line-height: 1.75; font-weight: 300; }
.cta-actions { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
.cta-note { font-size: 0.76rem; color: rgba(255,255,255,0.3); margin-top: 1.3rem; letter-spacing: 0.06em; }

/* ── CONTACT ── */
.contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 5rem; }
.contact-info .label { margin-bottom: 0.4rem; }
.contact-info h2 { font-size: 2.1rem; font-weight: 700; margin-bottom: 0.7rem; }
.contact-info > p { font-size: 0.92rem; color: var(--text-mid); margin-bottom: 2.2rem; line-height: 1.8; font-weight: 300; }
.contact-details { display: flex; flex-direction: column; gap: 1.4rem; }
.contact-detail { display: flex; align-items: flex-start; gap: 0.9rem; }
.contact-detail-icon {
  width: 40px; height: 40px; flex-shrink: 0;
  background: var(--gold-pale); border: 1px solid rgba(184,146,42,0.3);
  border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 1rem;
}
.contact-detail-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-light); margin-bottom: 0.18rem; }
.contact-detail-value { font-size: 0.9rem; color: var(--text-dark); font-weight: 400; }
.contact-detail-value a { color: var(--gold-dark); text-decoration: none; }
.contact-detail-value a:hover { text-decoration: underline; }
.contact-form {
  background: var(--white); border: 1px solid var(--border-dark);
  border-top: 3px solid var(--gold);
  border-radius: 4px; padding: 2.8rem; box-shadow: var(--shadow-sm);
}
.contact-form h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.4rem; }
.contact-form > p { font-size: 0.85rem; color: var(--text-mid); margin-bottom: 2rem; font-weight: 300; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
.form-group label { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--navy-deep); }
.form-group input, .form-group select, .form-group textarea {
  font-family: 'Source Sans 3', sans-serif; font-size: 0.92rem; color: var(--text-dark);
  background: var(--off-white); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0.72rem 0.95rem;
  transition: var(--transition); outline: none; width: 100%;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--gold); background: var(--white);
  box-shadow: 0 0 0 3px rgba(184,146,42,0.12);
}
.form-group textarea { min-height: 110px; resize: vertical; }
.form-submit { width: 100%; margin-top: 0.5rem; justify-content: center; font-size: 0.85rem; }

/* ── FOOTER ── */

<script>
(function() {
  var DESKTOP_SHOW = 3;   // cards visible at once on desktop
  var MOBILE_SHOW  = 1;   // cards visible at once on mobile
  var STAY_MS      = 3000; // how long each set stays visible
  var SLIDE_MS     = 420;  // slide-in/out duration (ms) — quick snap
  var GAP_PX       = 16;   // gap between cards (matches CSS gap: 1rem)

  var track   = document.getElementById('slideshowTrack');
  var dotsEl  = document.getElementById('slideshowDots');
  if (!track) return;

  var cards   = Array.from(track.querySelectorAll('.blog-card'));
  var total   = cards.length;
  var current = 0;
  var timer   = null;
  var running = true;

  function isMobile() { return window.innerWidth <= 768; }
  function showCount() { return isMobile() ? MOBILE_SHOW : DESKTOP_SHOW; }

  // Build dot indicators
  function buildDots() {
    dotsEl.innerHTML = '';
    var groups = Math.ceil(total / showCount());
    for (var i = 0; i < groups; i++) {
      var dot = document.createElement('button');
      dot.className = 'slideshow-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      dot.dataset.index = i;
      dot.addEventListener('click', function() {
        goTo(parseInt(this.dataset.index) * showCount(), true);
      });
      dotsEl.appendChild(dot);
    }
  }

  function updateDots() {
    var dots = dotsEl.querySelectorAll('.slideshow-dot');
    var activeGroup = Math.floor(current / showCount());
    dots.forEach(function(d, i) {
      d.classList.toggle('active', i === activeGroup);
    });
  }

  // Position all cards: visible ones side-by-side, others offscreen right
  function layout(direction) {
    var n    = showCount();
    var w    = track.offsetWidth;
    var cardW = (w - GAP_PX * (n - 1)) / n;

    cards.forEach(function(card, i) {
      card.style.width      = cardW + 'px';
      card.style.transition = 'none';
      var slot = i - current;
      if (slot >= 0 && slot < n) {
        // Visible position — start offscreen in the direction
        var x = direction === 'in'
          ? (w + GAP_PX)                      // enter from right
          : (slot * (cardW + GAP_PX));        // already-visible position
        card.style.transform = direction === 'in'
          ? 'translateX(' + (w + GAP_PX) + 'px)'
          : 'translateX(' + (slot * (cardW + GAP_PX)) + 'px)';
      } else {
        // Off-screen right (waiting)
        card.style.transform = 'translateX(' + (w * 2) + 'px)';
      }
    });
  }

  function show(direction) {
    var n    = showCount();
    var w    = track.offsetWidth;
    var cardW = (w - GAP_PX * (n - 1)) / n;

    // Step 1: position incoming cards off-screen right, outgoing in place
    cards.forEach(function(card, i) {
      card.style.width      = cardW + 'px';
      card.style.transition = 'none';
      var slot = i - current;
      if (slot >= 0 && slot < n) {
        // New visible cards — start from right
        card.style.transform = 'translateX(' + (w + GAP_PX) + 'px)';
      } else {
        // Keep everything else off right (hidden)
        card.style.transform = 'translateX(' + (w * 2) + 'px)';
      }
    });

    // Force reflow so transition fires
    track.offsetHeight;

    // Step 2: slide everything into final position
    cards.forEach(function(card, i) {
      card.style.transition = 'transform ' + SLIDE_MS + 'ms cubic-bezier(0.25,0.46,0.45,0.94)';
      var slot = i - current;
      if (slot >= 0 && slot < n) {
        // Slide into place
        card.style.transform = 'translateX(' + (slot * (cardW + GAP_PX)) + 'px)';
      } else if (i < current) {
        // Previously visible — slide out to the left
        card.style.transition = 'transform ' + SLIDE_MS + 'ms cubic-bezier(0.25,0.46,0.45,0.94)';
        card.style.transform  = 'translateX(-' + (w + GAP_PX) + 'px)';
      }
    });

    updateDots();
  }

  function next() {
    var n = showCount();
    current = (current + n) % total;
    // Wrap: if remaining cards < n, go back to 0
    if (current + n > total) current = 0;
    show('in');
  }

  function goTo(idx, resetTimer) {
    current = idx;
    show('in');
    if (resetTimer) {
      clearInterval(timer);
      if (running) timer = setInterval(next, STAY_MS + SLIDE_MS);
    }
  }

  function start() {
    buildDots();
    show('initial');
    timer = setInterval(next, STAY_MS + SLIDE_MS);
  }

  // Initial show — place first set without animation
  function initialShow() {
    var n    = showCount();
    var w    = track.offsetWidth;
    var cardW = (w - GAP_PX * (n - 1)) / n;
    cards.forEach(function(card, i) {
      card.style.width      = cardW + 'px';
      card.style.transition = 'none';
      var slot = i - current;
      if (slot >= 0 && slot < n) {
        card.style.transform = 'translateX(' + (slot * (cardW + GAP_PX)) + 'px)';
      } else {
        card.style.transform = 'translateX(' + (w * 2) + 'px)';
      }
    });
    updateDots();
  }

  // Pause on hover / touch
  track.parentElement.addEventListener('mouseenter', function() {
    running = false; clearInterval(timer);
  });
  track.parentElement.addEventListener('mouseleave', function() {
    running = true; timer = setInterval(next, STAY_MS + SLIDE_MS);
  });
  track.parentElement.addEventListener('touchstart', function() {
    clearInterval(timer);
  }, { passive: true });
  track.parentElement.addEventListener('touchend', function() {
    timer = setInterval(next, STAY_MS + SLIDE_MS);
  }, { passive: true });

  // Rebuild on resize
  window.addEventListener('resize', function() {
    clearInterval(timer);
    current = 0;
    buildDots();
    initialShow();
    timer = setInterval(next, STAY_MS + SLIDE_MS);
  });

  // Kick off
  buildDots();
  initialShow();
  timer = setInterval(next, STAY_MS + SLIDE_MS);
})();
</script>
